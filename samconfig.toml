# SAM CLI configuration for the Visitor Counter API.
# Two deploy environments, each a separate CloudFormation stack in the same
# AWS account. Invoke with:  sam deploy --config-env dev | prod
version = 0.1

[dev.deploy.parameters]
stack_name = "visitor-counter-dev"
# Pin to the pre-provisioned SAM managed artifact bucket instead of resolve_s3.
# resolve_s3 runs a CreateChangeSet against the aws-sam-cli-managed-default
# stack on every deploy, which the scoped CI role (visitor-counter-* only) is
# not permitted to touch. The bucket is bootstrapped once by an admin.
s3_bucket = "aws-sam-cli-managed-default-samclisourcebucket-xd4zuudla0yr"
region = "ap-southeast-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
parameter_overrides = "Stage=dev AllowOrigin=\"*\""

[prod.deploy.parameters]
stack_name = "visitor-counter-prod"
# See the dev note above: pin the managed bucket instead of resolve_s3 so the
# scoped CI role never needs CloudFormation access to aws-sam-cli-managed-default.
s3_bucket = "aws-sam-cli-managed-default-samclisourcebucket-xd4zuudla0yr"
region = "ap-southeast-2"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
parameter_overrides = "Stage=prod AllowOrigin=\"https://res.id.au\""
